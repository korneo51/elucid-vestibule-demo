/* Four independent layers: room image → sliding leaves → cutaway reception → fixed signs.
   Apertures and projection share hall-layout.json; signs have separate wall anchors. */
.layered-hall .wall{background:#101b2a}
.layered-hall .hall-artboard{position:absolute;isolation:isolate}
.layered-hall .hall-mask-defs{position:absolute}
.layered-hall .hall-background{position:absolute;inset:0;width:100%;height:100%;max-width:none;z-index:2;clip-path:url(#hall-apertures-v3);pointer-events:none}
.layered-hall .side-access,.layered-hall .hall-sign,.layered-hall .portal-cue{position:absolute;left:0;top:0;right:auto;width:360px;height:540px;transform-origin:0 0;perspective:none}
.layered-hall .side-access{z-index:1}
.layered-hall .room-link{position:absolute;inset:0;width:100%;height:100%;padding:0;border:0;background:#0b1220;transform:none;box-shadow:none;filter:none;overflow:hidden;isolation:isolate}
.layered-hall .room-link:before{display:none}
.layered-hall .room-link:focus-visible{outline:4px solid #f8bb64;outline-offset:-5px}
.layered-hall .side-access.laboratory{box-shadow:none}
.layered-hall .portal-room{position:absolute;inset:0;overflow:hidden}
.layered-hall .portal-room img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 45%;max-width:none}
.layered-hall .portal-room:after{content:&#x27;&#x27;;position:absolute;inset:0;box-shadow:inset 0 0 22px 5px #03091288}
.layered-hall .door-opening{position:absolute;inset:-.5px;overflow:hidden;pointer-events:none}
.layered-hall .slide-half{position:absolute;top:0;bottom:0;width:50%;overflow:hidden;transition:transform .7s cubic-bezier(.22,.7,.2,1)}
.layered-hall .slide-left{left:0}.layered-hall .slide-right{right:0}
.layered-hall .sliding-face{position:absolute;left:0;top:0;bottom:0;width:200%;background-image:var(--door-art);background-size:100% 100%;background-position:center}
.layered-hall .slide-right .sliding-face{left:-100%}
/* No extra dark divider: the native seam in the artwork is sufficient. */
.layered-hall .room-link:hover .slide-left,.layered-hall .room-link:focus-visible .slide-left,.layered-hall .room-link.is-preview .slide-left{transform:translateX(-100%)}
.layered-hall .room-link:hover .slide-right,.layered-hall .room-link:focus-visible .slide-right,.layered-hall .room-link.is-preview .slide-right{transform:translateX(100%)}
.layered-hall .hall-sign{width:440px;height:150px;z-index:3;pointer-events:none;backface-visibility:hidden}
.layered-hall .room-sign{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#ffe7b8;isolation:isolate}
.layered-hall .room-sign&gt;span{position:relative;z-index:1;font:bold 45px/1.1 Georgia,serif;text-shadow:0 0 5px #ffc56f,0 0 18px #ed9a5588,0 2px 2px #000b}
.layered-hall .laboratory .room-sign&gt;span{font:700 61px/1 Manrope,sans-serif;letter-spacing:-.055em;text-shadow:0 0 7px #a3f4ff,0 0 20px #1eadd588,0 2px 2px #000b}
.layered-hall .laboratory .room-sign&gt;span&gt;span{color:#ffb266;text-shadow:0 0 9px #ff9a4e,0 0 20px #ff893588}
/* Both horizontal edges converge to the same point as the ceiling and floor lines. */
.layered-hall .hall-sign .room-sign{background:linear-gradient(140deg,#233047,#0b1725 80%);border:4px solid #e9ae68;box-shadow:0 0 0 5px #162539,0 0 0 7px #a9804e99,0 0 17px 8px #ffab4b77,inset 0 0 0 5px #8c6943,inset 0 0 28px #efac5655}
.layered-hall .hall-sign .room-sign:after{content:&#x27;&#x27;;position:absolute;inset:11px;border:1px solid #e8bc7977}
.layered-hall .hall-sign.laboratory .room-sign{background:linear-gradient(140deg,#14334c,#091c2d 80%);border-color:#82e9f2;box-shadow:0 0 0 5px #102c42,0 0 0 7px #65cdda99,0 0 18px 9px #4ad8ee77,inset 0 0 0 5px #397c9a,inset 0 0 28px #4bd9f466}
.layered-hall .hall-sign.laboratory .room-sign:after{border-color:#8ce4ef77}
/* These cues lie on the two receding side walls, not on the camera plane. */
.layered-hall .portal-cue{width:220px;height:110px;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:0;border:0;background:none;box-shadow:none;filter:none;color:#f5c68a;opacity:0;pointer-events:none;backface-visibility:hidden;transition:opacity .35s,filter .25s;cursor:pointer}
.layered-hall.cue-active .portal-cue{opacity:1;pointer-events:auto;animation:cue-pulse 1.5s ease-in-out infinite}
.layered-hall .portal-cue.laboratory{color:#9bedf8}
.layered-hall .portal-cue span{font:700 19px/1 Manrope,sans-serif;letter-spacing:.09em;text-shadow:0 0 8px currentColor,0 2px 4px #000b}
.layered-hall .portal-cue .cue-mobile{display:none}
.layered-hall .portal-cue svg{display:block;width:200px;height:72px;overflow:visible;filter:drop-shadow(0 0 5px currentColor)}
.layered-hall .portal-cue path{fill:none;stroke:currentColor;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.layered-hall .portal-cue:hover,.layered-hall .portal-cue:focus-visible{filter:brightness(1.35)}
.layered-hall.cue-active .portal-cue:hover,.layered-hall.cue-active .portal-cue:focus-visible{animation:none;opacity:1}
.layered-hall .portal-cue:focus-visible{outline:3px solid currentColor;outline-offset:4px}
@keyframes cue-pulse{0%,100%{opacity:1}50%{opacity:.3}}
.mobile-pan-hint{display:none}
.layered-hall .tilt-control{display:none}
.layered-hall.look-active .tilt-control{pointer-events:auto}
.layered-hall .hall-label{display:none}
.viewport.is-hall .route-guide{opacity:0}
.route-guide{transition:opacity .25s}
.layered-hall .threshold{border:3px solid #e48730;box-shadow:0 0 0 4px #162230,0 0 0 8px #ec8424,0 7px 15px #0007}
.layered-hall .threshold:after{border:none;box-shadow:none}
.layered-hall .threshold .leaf{background:linear-gradient(100deg,#132130,#263b4c,#142331)}
.layered-hall .door-mark{bottom:-35px;color:#e7d1ab;font-size:11px;letter-spacing:.1em;opacity:.88;text-shadow:0 2px 8px #020916}
.rouages-dialog .dialog-art{background:#241b16}
.rouages-dialog .dialog-art img{object-fit:contain}
@media(max-width:760px){
 .viewport.is-hall{touch-action:pan-y}
 .layered-hall .portal-cue .cue-desktop{display:none}
 .layered-hall .portal-cue .cue-mobile{display:inline}
 .layered-hall .portal-cue.left{margin-left:-30px}
 .layered-hall .portal-cue.right{margin-left:30px}
 .layered-hall .mobile-pan-hint{position:absolute;z-index:8;display:block;left:0;right:0;bottom:7%;text-align:center;font:700 11px/1.2 Manrope,sans-serif;letter-spacing:.12em;color:#f3e1c3;text-shadow:0 2px 8px #000;pointer-events:none}
 .layered-hall:not(.look-active) .mobile-pan-hint{opacity:0}
 .layered-hall .mobile-pan-hint small{display:block;margin-top:8px;font-size:9px;letter-spacing:.14em;color:#b8c5d2}
 .layered-hall .tilt-control{position:absolute;z-index:9;display:block;left:50%;bottom:1.5%;transform:translateX(-50%);width:max-content;max-width:92%;min-height:40px;padding:10px 16px;border:1px solid #b5d9e077;border-radius:24px;background:#0d1c2ccc;color:#bce8ef;font:700 10px/1.1 Manrope,sans-serif;letter-spacing:.08em;cursor:pointer;opacity:.9}
 .layered-hall .tilt-control[aria-pressed=&quot;true&quot;]{border-color:#90f2ff;color:#fff;box-shadow:0 0 10px #4ad8ee77}
 .layered-hall:not(.look-active) .tilt-control{opacity:0;pointer-events:none}
}

@media(prefers-reduced-motion:reduce){.layered-hall .slide-half,.layered-hall .portal-cue{transition:none;animation:none}}

&lt;div id=&quot;ee-home&quot; class=&quot;practical&quot;&gt;&lt;div class=&quot;practical-intro&quot; id=&quot;infos&quot;&gt;&lt;p class=&quot;eyebrow&quot;&gt;L’AVENTURE, CÔTÉ PRATIQUE&lt;/p&gt;&lt;h2&gt;Préparez votre visite.&lt;/h2&gt;&lt;/div&gt;&lt;section class=&quot;ee-pricing ee-section&quot; id=&quot;ee-tarifs&quot; aria-labelledby=&quot;ee-pricing-title&quot;&gt;&lt;div class=&quot;ee-reveal&quot;&gt;&lt;p class=&quot;ee-kicker&quot;&gt;04 / Composez votre équipe&lt;/p&gt;&lt;h2 id=&quot;ee-pricing-title&quot;&gt;Qui embarque&lt;br&gt;&lt;span&gt;avec vous ?&lt;/span&gt;&lt;/h2&gt;&lt;p class=&quot;ee-pricing-intro&quot;&gt;Choisissez votre nombre de joueurs.&lt;br&gt;Le reste se joue sur place.&lt;/p&gt;&lt;div class=&quot;ee-player-selector&quot; role=&quot;group&quot; aria-label=&quot;Nombre de joueurs&quot;&gt;&lt;button type=&quot;button&quot; data-players=&quot;2&quot; aria-pressed=&quot;false&quot;&gt;2&lt;/button&gt;&lt;button type=&quot;button&quot; data-players=&quot;3&quot; aria-pressed=&quot;false&quot;&gt;3&lt;/button&gt;&lt;button type=&quot;button&quot; data-players=&quot;4&quot; aria-pressed=&quot;true&quot;&gt;4&lt;/button&gt;&lt;button type=&quot;button&quot; data-players=&quot;5&quot; aria-pressed=&quot;false&quot;&gt;5&lt;/button&gt;&lt;button type=&quot;button&quot; data-players=&quot;6&quot; aria-pressed=&quot;false&quot;&gt;6&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;ee-price-result&quot; aria-live=&quot;polite&quot; aria-atomic=&quot;true&quot;&gt;&lt;span&gt;&lt;strong data-price&gt;24&lt;/strong&gt;&lt;b&gt;€&lt;/b&gt; &lt;span data-price-unit&gt;/ personne&lt;/span&gt;&lt;/span&gt;&lt;p data-total&gt;96 € la session pour 4 joueurs&lt;/p&gt;&lt;/div&gt;&lt;a class=&quot;ee-text-link&quot; href=&quot;https://elucidescape.fr/booking/&quot;&gt;Choisir mon créneau &lt;span aria-hidden=&quot;true&quot;&gt;↗&lt;/span&gt;&lt;/a&gt;&lt;/div&gt;&lt;div class=&quot;ee-price-details ee-reveal&quot;&gt;&lt;table&gt;&lt;caption&gt;Tous les tarifs&lt;/caption&gt;&lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;Votre équipe&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Tarif&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;2 joueurs*&lt;/th&gt;&lt;td&gt;75 € &lt;span&gt;la session&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;3 joueurs&lt;/th&gt;&lt;td&gt;28 € &lt;span&gt;/ personne&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;4 joueurs&lt;/th&gt;&lt;td&gt;24 € &lt;span&gt;/ personne&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;5 joueurs&lt;/th&gt;&lt;td&gt;20 € &lt;span&gt;/ personne&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;6 joueurs*&lt;/th&gt;&lt;td&gt;20 € &lt;span&gt;/ personne&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;div class=&quot;ee-price-notes&quot;&gt;&lt;p&gt;* Tenter l’aventure à 2 demande un minimum d’expérience.&lt;/p&gt;&lt;p&gt;Nous vous déconseillons les équipes de 6, car la cohésion devient difficile.&lt;/p&gt;&lt;p&gt;Pour les groupes plus nombreux, &lt;a href=&quot;#ee-contact&quot;&gt;contactez-nous&lt;/a&gt;.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;ee-faq ee-section&quot; id=&quot;ee-faq&quot; aria-labelledby=&quot;ee-faq-title&quot;&gt;&lt;div class=&quot;ee-reveal&quot;&gt;&lt;p class=&quot;ee-kicker&quot;&gt;05 / Avant de pousser la porte&lt;/p&gt;&lt;h2 id=&quot;ee-faq-title&quot;&gt;Encore&lt;br&gt;&lt;span&gt;une question ?&lt;/span&gt;&lt;/h2&gt;&lt;/div&gt;&lt;div class=&quot;ee-faq-list ee-reveal&quot;&gt;&lt;details&gt;&lt;summary&gt;Qu’est-ce qu’un escape game ?&lt;/summary&gt;&lt;p&gt;Enfermé dans une salle, vous devez trouver les objets cachés et les indices pour résoudre diverses énigmes qui vous mèneront à la sortie avant le temps imparti.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Qui peut venir jouer ?&lt;/summary&gt;&lt;p&gt;Notre salle est accessible aux plus jeunes, dès 8 ans. Cependant, nous ne pouvons accueillir de groupes de moins de 15 ans non accompagnés d’un adulte.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Comment se déroule une partie ?&lt;/summary&gt;&lt;ol&gt;&lt;li&gt;Accueil et présentation des consignes de sécurité : 10 min&lt;/li&gt;&lt;li&gt;Présentation du scénario : 5 min&lt;/li&gt;&lt;li&gt;Session de jeu : 90 min maximum&lt;/li&gt;&lt;li&gt;Compte-rendu : 10 min&lt;/li&gt;&lt;/ol&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Quelle est la difficulté du jeu ?&lt;/summary&gt;&lt;p&gt;Le jeu ne requiert pas de conditions physiques particulières ni de compétences spécifiques. La difficulté est modérée et accessible à tous.&lt;/p&gt;&lt;/details&gt;&lt;details&gt;&lt;summary&gt;Effrayé ?&lt;/summary&gt;&lt;p&gt;À moins d’être extrêmement claustrophobe, n’ayez aucune crainte. Pour les besoins du scénario, l’éclairage est tamisé et vous serez plongé dans l’obscurité pendant un bref instant.&lt;/p&gt;&lt;p&gt;Bien qu’enfermé dans la salle, vous pouvez déverrouiller la porte et rallumer l’éclairage à tout moment.&lt;/p&gt;&lt;/details&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;ee-gift&quot; id=&quot;ee-cadeaux&quot; aria-labelledby=&quot;ee-gift-title&quot;&gt;&lt;div class=&quot;ee-gift-orbit&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;&lt;div class=&quot;ee-gift-copy ee-reveal&quot;&gt;&lt;p class=&quot;ee-kicker&quot;&gt;À offrir / À vivre&lt;/p&gt;&lt;h2 id=&quot;ee-gift-title&quot;&gt;Offrez autre chose&lt;br&gt;&lt;span&gt;qu’un objet.&lt;/span&gt;&lt;/h2&gt;&lt;p&gt;Une aventure à partager.&lt;br&gt;Les cartes cadeaux sont là.&lt;/p&gt;&lt;a class=&quot;ee-button&quot; href=&quot;https://elucidescape.fr/cartecadeau/&quot;&gt;Offrir une carte cadeau &lt;span aria-hidden=&quot;true&quot;&gt;↗&lt;/span&gt;&lt;/a&gt;&lt;/div&gt;&lt;div class=&quot;ee-gift-art ee-reveal ee-from-right&quot; aria-hidden=&quot;true&quot;&gt;&lt;div class=&quot;ee-ticket&quot;&gt;&lt;div class=&quot;ee-ticket-top&quot;&gt;&lt;img src=&quot;https://elucidescape.fr/wp-content/uploads/2026/09/elucid-v6-header-860x320-1.png&quot; width=&quot;150&quot; height=&quot;56&quot; alt=&quot;&quot; loading=&quot;lazy&quot;&gt;&lt;span&gt;À VOUS&lt;br&gt;DE JOUER.&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;ee-ticket-main&quot;&gt;CARTE&lt;br&gt;&lt;em&gt;CADEAU&lt;/em&gt;&lt;/div&gt;&lt;div class=&quot;ee-ticket-bottom&quot;&gt;&lt;span&gt;UNE AVENTURE À OFFRIR&lt;/span&gt;&lt;span&gt;↗&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;ee-reviews ee-section&quot; aria-labelledby=&quot;ee-reviews-title&quot;&gt;&lt;div class=&quot;ee-review-side ee-reveal&quot;&gt;&lt;p class=&quot;ee-kicker&quot;&gt;03 / Ils ont joué le jeu&lt;/p&gt;&lt;h2 id=&quot;ee-reviews-title&quot;&gt;Leurs mots.&lt;br&gt;&lt;span&gt;Votre prochaine sortie.&lt;/span&gt;&lt;/h2&gt;&lt;p class=&quot;ee-rating&quot;&gt;&lt;strong&gt;5,0&lt;span&gt;/5&lt;/span&gt;&lt;/strong&gt;&lt;span class=&quot;ee-stars&quot; aria-label=&quot;5 étoiles sur 5&quot;&gt;★★★★★&lt;/span&gt;&lt;/p&gt;&lt;p class=&quot;ee-muted&quot;&gt;263 avis sur Google&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;ee-review-stage ee-reveal&quot;&gt;&lt;div class=&quot;ee-review-list&quot; aria-live=&quot;polite&quot;&gt;&lt;article class=&quot;ee-review&quot; aria-label=&quot;Avis 1 sur 9&quot;&gt;&lt;blockquote&gt;« Pour notre tout premier Escape Game, nous avons adoré l’expérience à deux ! »&lt;/blockquote&gt;&lt;p class=&quot;ee-review-author&quot;&gt;Elody Lecarpentier&lt;span&gt;Avis Google&lt;/span&gt;&lt;/p&gt;&lt;details class=&quot;ee-review-more&quot;&gt;&lt;summary&gt;Lire la suite&lt;/summary&gt;&lt;p&gt;Les explications sont très claires dès le début, les gérants sont adorables, bienveillants et vraiment à l’écoute. Gros plus : ils nous ont accordé 6 minutes supplémentaires à la fin, ce qui nous a permis de terminer notre aventure… et quel plaisir de réussir à aller jusqu’au bout ! Les 90 minutes passent à une vitesse folle ! La salle est spacieuse, les décors sont vraiment très bien réalisés et l’immersion est au rendez-vous. Les énigmes sont parfaitement pensées : elles demandent un peu de réflexion, mais restent accessibles et surtout très agréables à résoudre. Nous sommes ressortis plus que satisfaits de cette première expérience et nous avons déjà hâte de découvrir la deuxième salle à son ouverture pour poursuivre l’aventure ! Un grand merci pour votre accueil et votre gentillesse. Nous recommandons à 100 % et reviendrons avec grand plaisir !&lt;/p&gt;&lt;/details&gt;&lt;/article&gt;&lt;article class=&quot;ee-review&quot; aria-label=&quot;Avis 2 sur 9&quot;&gt;&lt;blockquote&gt;« L’accueil au top, très bons échanges avec notre hôte. »&lt;/blockquote&gt;&lt;p class=&quot;ee-review-author&quot;&gt;Aurelia Jolly&lt;span&gt;Avis Google&lt;/span&gt;&lt;/p&gt;&lt;details class=&quot;ee-review-more&quot;&gt;&lt;summary&gt;Lire la suite&lt;/summary&gt;&lt;p&gt;Salle et énigmes très bien conçues. le concept est très bien ficelé. Je recommande vivement l’expérience 👍&lt;/p&gt;&lt;/details&gt;&lt;/article&gt;&lt;article class=&quot;ee-review&quot; aria-label=&quot;Avis 3 sur 9&quot;&gt;&lt;blockquote&gt;« 90 min qui sont passés à une vitesse folle ! »&lt;/blockquote&gt;&lt;p class=&quot;ee-review-author&quot;&gt;Romain FERY&lt;span&gt;Avis Google&lt;/span&gt;&lt;/p&gt;&lt;details class=&quot;ee-review-more&quot;&gt;&lt;summary&gt;Lire la suite&lt;/summary&gt;&lt;p&gt;Après 90 min (et un petit temps supplémentaire) de travail méningé, de communication, de fouille et de recherches et après bon nombre de questionnements, nous voilà enfin sorti d’un superbe escape game. Coffre, cadenas, code et ensembles à reconstituer nous on fait suer ! Température climatisée à l’intérieur. Suivi de près par le game master qui nous guide et nous aide quand les réflexions sont trop intenses mais infructueuses. Merci pour cette belle expérience !&lt;/p&gt;&lt;/details&gt;&lt;/article&gt;&lt;article class=&quot;ee-review&quot; aria-label=&quot;Avis 4 sur 9&quot;&gt;&lt;blockquote&gt;« Nous avons passé un très bon moment. »&lt;/blockquote&gt;&lt;p class=&quot;ee-review-author&quot;&gt;Claire Masson&lt;span&gt;Avis Google&lt;/span&gt;&lt;/p&gt;&lt;/article&gt;&lt;article class=&quot;ee-review&quot; aria-label=&quot;Avis 5 sur 9&quot;&gt;&lt;blockquote&gt;« Superbe expérience qui fait bien travailler les méninges. »&lt;/blockquote&gt;&lt;p class=&quot;ee-review-author&quot;&gt;Marceline Camberlin&lt;span&gt;Avis Google&lt;/span&gt;&lt;/p&gt;&lt;details class=&quot;ee-review-more&quot;&gt;&lt;summary&gt;Lire la suite&lt;/summary&gt;&lt;p&gt;Les indices sont complexes mais pas insurmontable et bien penser. On attend avec impatience la 2 eme salle. A bientôt&lt;/p&gt;&lt;/details&gt;&lt;/article&gt;&lt;article class=&quot;ee-review&quot; aria-label=&quot;Avis 6 sur 9&quot;&gt;&lt;blockquote&gt;« La salle est truffée d’énigmes et d’objets à collecter pour les amateurs de fouille. »&lt;/blockquote&gt;&lt;p class=&quot;ee-review-author&quot;&gt;Bruno D.&lt;span&gt;Avis Google&lt;/span&gt;&lt;/p&gt;&lt;details class=&quot;ee-review-more&quot;&gt;&lt;summary&gt;Lire la suite&lt;/summary&gt;&lt;p&gt;Nous avons fait les rouages de l’apocalypse ce matin. La game master a été très agréable du début à la fin et n’intervenait qu’à quelques moments de manière pertinente pour ne pas dévoiler toute la solution. C’était un bon moment, je remercie l’établissement&lt;/p&gt;&lt;/details&gt;&lt;/article&gt;&lt;article class=&quot;ee-review&quot; aria-label=&quot;Avis 7 sur 9&quot;&gt;&lt;blockquote&gt;« C’était mon premier escape game. »&lt;/blockquote&gt;&lt;p class=&quot;ee-review-author&quot;&gt;Marie-Claude Appert&lt;span&gt;Avis Google&lt;/span&gt;&lt;/p&gt;&lt;details class=&quot;ee-review-more&quot;&gt;&lt;summary&gt;Lire la suite&lt;/summary&gt;&lt;p&gt;Et je ne regrette pas, tout est bien pensé, organisé, j’ai adoré et je vous le recommande. 👏&lt;/p&gt;&lt;/details&gt;&lt;/article&gt;&lt;article class=&quot;ee-review&quot; aria-label=&quot;Avis 8 sur 9&quot;&gt;&lt;blockquote&gt;« De quoi passer une bonne soirée et se creuser les méninges pendant 90 min !! »&lt;/blockquote&gt;&lt;p class=&quot;ee-review-author&quot;&gt;Leslie Sirianni&lt;span&gt;Avis Google&lt;/span&gt;&lt;/p&gt;&lt;details class=&quot;ee-review-more&quot;&gt;&lt;summary&gt;Lire la suite&lt;/summary&gt;&lt;p&gt;Le décor est vrai sympa et très adapté ! Le gérant a été aux petits soins avec nous vu la chaleur !! A refaire sans hésitation !!&lt;/p&gt;&lt;/details&gt;&lt;/article&gt;&lt;article class=&quot;ee-review&quot; aria-label=&quot;Avis 9 sur 9&quot;&gt;&lt;blockquote&gt;« Très bon moment pour les 11 ans de ma fille et son groupe d’amis. »&lt;/blockquote&gt;&lt;p class=&quot;ee-review-author&quot;&gt;Alison Blondy&lt;span&gt;Avis Google&lt;/span&gt;&lt;/p&gt;&lt;details class=&quot;ee-review-more&quot;&gt;&lt;summary&gt;Lire la suite&lt;/summary&gt;&lt;p&gt;Très bonne organisation. Les énigmes étaient très bien pensées. Je recommande !&lt;/p&gt;&lt;/details&gt;&lt;/article&gt;&lt;/div&gt;&lt;div class=&quot;ee-review-controls&quot; hidden&gt;&lt;button type=&quot;button&quot; data-review-step=&quot;-1&quot; aria-label=&quot;Avis précédent&quot;&gt;←&lt;/button&gt;&lt;span class=&quot;ee-review-count&quot; aria-hidden=&quot;true&quot;&gt;01 / 09&lt;/span&gt;&lt;button type=&quot;button&quot; data-review-step=&quot;1&quot; aria-label=&quot;Avis suivant&quot;&gt;→&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;ee-experience ee-section&quot; aria-labelledby=&quot;ee-experience-title&quot;&gt;&lt;div class=&quot;ee-experience-intro ee-reveal&quot;&gt;&lt;p class=&quot;ee-kicker&quot;&gt;02 / Le jeu se vit ensemble&lt;/p&gt;&lt;h2 id=&quot;ee-experience-title&quot;&gt;Vos idées.&lt;br&gt;Votre équipe.&lt;br&gt;&lt;span&gt;Votre déclic.&lt;/span&gt;&lt;/h2&gt;&lt;/div&gt;&lt;div class=&quot;ee-principles&quot;&gt;&lt;article class=&quot;ee-reveal&quot;&gt;&lt;span class=&quot;ee-step&quot;&gt;01&lt;/span&gt;&lt;div&gt;&lt;h3&gt;L’esprit d’équipe&lt;/h3&gt;&lt;p&gt;Alors que la plupart des activités de groupes sont basées sur la compétition, l’escape game, au contraire, mise sur la cohésion d’équipe. Ce n’est qu’en unissant vos forces que vous parviendrez à vous en sortir.&lt;/p&gt;&lt;/div&gt;&lt;/article&gt;&lt;article class=&quot;ee-reveal&quot;&gt;&lt;span class=&quot;ee-step&quot;&gt;02&lt;/span&gt;&lt;div&gt;&lt;h3&gt;1h30 pour s’échapper&lt;/h3&gt;&lt;p&gt;Vous n’aurez pas une minute à perdre pour parvenir à élucider les énigmes qui vous attendent…&lt;/p&gt;&lt;/div&gt;&lt;/article&gt;&lt;article class=&quot;ee-reveal&quot;&gt;&lt;span class=&quot;ee-step&quot;&gt;03&lt;/span&gt;&lt;div&gt;&lt;h3&gt;La logique&lt;/h3&gt;&lt;p&gt;Chaque énigme demande une logique différente. Vous devrez donc vous adapter et mettre à profit les compétences de chacun d’entre vous.&lt;/p&gt;&lt;/div&gt;&lt;/article&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;ee-audience ee-section&quot; aria-labelledby=&quot;ee-audience-title&quot;&gt;&lt;p class=&quot;ee-kicker ee-reveal&quot; id=&quot;ee-audience-title&quot;&gt;À qui s’adresse ce jeu ?&lt;/p&gt;&lt;div class=&quot;ee-audience-list&quot;&gt;&lt;span class=&quot;ee-reveal&quot;&gt;En famille&lt;/span&gt;&lt;span class=&quot;ee-reveal&quot;&gt;Entre amis&lt;/span&gt;&lt;a class=&quot;ee-reveal&quot; href=&quot;https://elucidescape.fr/entreprises/&quot;&gt;En entreprise &lt;span aria-hidden=&quot;true&quot;&gt;↗&lt;/span&gt;&lt;/a&gt;&lt;span class=&quot;ee-reveal&quot;&gt;En visite&lt;/span&gt;&lt;/div&gt;&lt;/section&gt;&lt;section class=&quot;ee-final ee-section&quot; id=&quot;ee-contact&quot; aria-labelledby=&quot;ee-contact-title&quot;&gt;&lt;p class=&quot;ee-kicker ee-reveal&quot;&gt;Le monde peut bien attendre.&lt;/p&gt;&lt;div class=&quot;ee-final-heading ee-reveal&quot;&gt;&lt;h2 id=&quot;ee-contact-title&quot;&gt;On vous&lt;br&gt;&lt;span&gt;garde une place ?&lt;/span&gt;&lt;/h2&gt;&lt;a class=&quot;ee-circle-cta&quot; href=&quot;https://elucidescape.fr/booking/&quot; aria-label=&quot;Réserver votre aventure&quot;&gt;&lt;span aria-hidden=&quot;true&quot;&gt;↗&lt;/span&gt;&lt;span&gt;RÉSERVER&lt;/span&gt;&lt;/a&gt;&lt;/div&gt;&lt;div class=&quot;ee-contact-grid&quot;&gt;&lt;div&gt;&lt;p class=&quot;ee-kicker&quot;&gt;Nous trouver&lt;/p&gt;&lt;address&gt;Elucid Escape&lt;br&gt;72 rue du Faubourg Saint Antoine&lt;br&gt;51000 Châlons-en-Champagne&lt;/address&gt;&lt;/div&gt;&lt;div&gt;&lt;p class=&quot;ee-kicker&quot;&gt;On en parle ?&lt;/p&gt;&lt;a href=&quot;tel:+33326673801&quot;&gt;03 26 67 38 01&lt;/a&gt;&lt;a href=&quot;mailto:contact@elucidescape.fr&quot;&gt;contact@elucidescape.fr&lt;/a&gt;&lt;/div&gt;&lt;div&gt;&lt;p class=&quot;ee-kicker&quot;&gt;Suivre l’aventure&lt;/p&gt;&lt;a href=&quot;https://www.instagram.com/elucid_escape&quot;&gt;Instagram ↗&lt;/a&gt;&lt;a href=&quot;https://www.facebook.com/elucidescape&quot;&gt;Facebook ↗&lt;/a&gt;&lt;a href=&quot;https://www.linkedin.com/in/elucid-escape/&quot;&gt;LinkedIn ↗&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&lt;/div&gt;

&lt;script&gt;
(() =&gt; {
 &#x27;use strict&#x27;;

 let step=600,hold=390,origin=0,requested=false,geometry=[],lastLabel=-1,hallFrame=null,hallClip=&#x27;&#x27;,hallLook=0,hallLookShown=0,drag=null,lastSwipe=0,previewTimer=null,sensorEnabled=false;

 // Door/interior share the cutaway aperture; signs have explicit anchors above each lintel.

 const hint=hall.querySelector(&#x27;.mobile-pan-hint&#x27;),tiltButton=hall.querySelector(&#x27;.tilt-control&#x27;);

 function roomFrame(W,H){const s=W&lt;=760?Math.max(W/artW,H*.9/artH):Math.min(W/artW,H/artH);return {width:artW*s,height:artH*s,x:(W-artW*s)/2,y:(H-artH*s)/2}}

   const sw=+el.dataset.sourceWidth||360,sh=+el.dataset.sourceHeight||540;

   for(let c=0;c&lt;8;c++){

 }
 function measure(){
  const W=viewport.clientWidth,H=innerHeight;step=Math.min(760,Math.max(480,H*(W&lt;=760?.76:.85)));hold=Math.round(step*(W&lt;=760?1.15:.68));origin=journey.getBoundingClientRect().top+scrollY;

   const frame=i===1?roomFrame(W,H):{width:W,height:H,x:0,y:0};
   const mobileFoyer=i===0?W&lt;=760:false;
   const cx=mobileFoyer?W*.69:frame.x+frame.width*Number(r.w.dataset.x),cy=mobileFoyer?H*.25:frame.y+frame.height*Number(r.w.dataset.y),dw=mobileFoyer?W*.58:frame.width*Number(r.w.dataset.w),dh=mobileFoyer?H*.28:frame.height*Number(r.w.dataset.h),x=cx-dw/2,y=cy-dh/2;

 }
